<head>
<meta charset="utf-8">

<title>Trixor – GTA RP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#120b2e; --dusk:#3a1456; --rose:#ff4d8d; --amber:#ffb347; --sun:#ff7a45;
  --paper:#f6f1e4; --ink:#1a1033; --txt:#fbf6ff; --mute:#b9a9d9;
  --card:rgba(255,255,255,.07); --edge:rgba(255,255,255,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100vh; color:var(--txt); font-family:'Manrope',system-ui,sans-serif; background:linear-gradient(180deg,#1b0f45 0%,var(--dusk) 38%,#7a2358 62%,var(--night) 100%) fixed var(--night); overflow-x:hidden}
.hero{position:relative; height:330px; overflow:hidden}
.sun{position:absolute; left:50%; top:46px; width:min(66vw,250px); aspect-ratio:1; translate:-50% 0; border-radius:50%;
  background:linear-gradient(180deg,var(--amber),var(--sun) 45%,var(--rose));
  -webkit-mask-image:linear-gradient(180deg,#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 70%,#000 70% 77%,transparent 77% 84%,#000 84% 90%,transparent 90% 100%);
  mask-image:linear-gradient(180deg,#000 0 52%,transparent 52% 56%,#000 56% 64%,transparent 64% 70%,#000 70% 77%,transparent 77% 84%,#000 84% 90%,transparent 90% 100%);
  filter:drop-shadow(0 0 40px rgba(255,100,120,.55)); animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{translate:-50% 60px; opacity:0}}
.city{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:auto; display:block}
main{max-width:480px; margin:0 auto; padding:0 20px 44px; text-align:center; position:relative; margin-top:-34px}
h1{font-family:'Syne',system-ui,sans-serif; font-weight:800; font-size:clamp(2.2rem,13.5vw,4.2rem); letter-spacing:-.04em; white-space:nowrap; line-height:.95; margin:0;
  background:linear-gradient(180deg,#fff 20%,#ffd1e3); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 24px rgba(255,77,141,.45))}
.plate{display:inline-block; margin:16px 0 14px; padding:6px 18px 5px; background:var(--paper); color:var(--ink); border-radius:9px; border-top:5px solid #2d5bd8;
  font-family:'Syne',sans-serif; font-weight:800; font-size:1.05rem; letter-spacing:.16em; box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper),0 10px 24px rgba(0,0,0,.4)}
.lead strong{color:var(--txt); font-size:1.1rem}
.lead{margin:0 auto 22px; max-width:32ch; color:var(--mute); font-size:.95rem; line-height:1.5}
.share{font:inherit; font-weight:700; font-size:.9rem; color:var(--ink); background:linear-gradient(90deg,var(--amber),var(--rose)); border:0; border-radius:99px; padding:12px 26px; cursor:pointer; box-shadow:0 8px 28px rgba(255,77,141,.4); transition:transform .2s, box-shadow .2s}
.share:hover{transform:translateY(-2px); box-shadow:0 12px 34px rgba(255,77,141,.55)}
.share:focus-visible,.links a:focus-visible{outline:2px solid #fff; outline-offset:3px}
.links{list-style:none; margin:34px 0 0; padding:0; display:grid; gap:10px}
.links a{display:flex; align-items:center; gap:14px; padding:12px 16px 12px 12px; text-decoration:none; color:var(--txt); text-align:left; background:var(--card); border:1px solid var(--edge); border-radius:18px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:transform .2s, background .2s, border-color .2s}
.links a:hover{transform:translateY(-2px); background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.34)}
.ic{flex:none; width:46px; height:46px; border-radius:13px; display:grid; place-items:center; background:var(--g)}
.ic svg{width:23px; height:23px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.t{display:flex; flex-direction:column; min-width:0}
.t b{font-weight:700; font-size:1rem}
.t span{font-size:.84rem; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.go{margin-left:auto; color:var(--mute); font-size:1.4rem; line-height:1}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); translate:-50% 20px; opacity:0; pointer-events:none; background:var(--paper); color:var(--ink); font-weight:700; font-size:.9rem; padding:11px 20px; border-radius:99px; transition:.3s}
.toast.on{opacity:1; translate:-50% 0}
@media (prefers-reduced-motion:reduce){.sun{animation:none}*{transition:none!important}}
</style>
</head>
